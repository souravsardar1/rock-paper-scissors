<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="game-container">
        <h1>Rock Paper Scissors</h1>
        <p>First player to reach 5 points wins!</p>

        <div class="buttons">
            <button id="rock">✊ Rock</button>
            <button id="paper">✋ Paper</button>
            <button id="scissors">✌️ Scissors</button>
        </div>

        <div id="results">
            <h2>Game Results</h2>
            <p id="round-result">Choose your move to start!</p>

            <div class="score">
                <p>Player: <span id="player-score">0</span></p>
                <p>Computer: <span id="computer-score">0</span></p>
            </div>

            <h2 id="winner"></h2>
        </div>
    </main>


    <script src="script.js"></script>
</body>
</html>
